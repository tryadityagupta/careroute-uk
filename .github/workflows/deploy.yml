name: UK CareRoute: test, then deploy to Azure

on:
  push:
    branches: [main]      # every push to main triggers this
  workflow_dispatch:      # ...and you can also run it by hand

permissions:
  id-token: write         # lets the job get the OIDC token for Azure login
  contents: read

# Tests always run. Build + deploy only run when the repository variable
# DEPLOY_ENABLED is "true" (Settings > Secrets and variables > Actions >
# Variables) AND the three AZURE_* secrets exist. A fresh copy of this repo
# therefore goes green on tests instead of failing at the Azure login.
env:
  RESOURCE_GROUP: careroute-uk-rg
  ACR_NAME: carerouteukacr
  CONTAINER_APP: careroute-uk-app
  IMAGE_NAME: careroute-uk

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Real Redis + Postgres for the statelessness tests, as throwaway sidecars.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
      postgres:
        image: postgis/postgis:16-3.4-alpine   # PostGIS for the provider directory
        env:
          POSTGRES_USER: careroute
          POSTGRES_PASSWORD: careroute
          POSTGRES_DB: careroute
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careroute" --health-interval 2s --health-retries 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Install map tooling for the PostGIS tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osm2pgsql postgresql-client

      - name: Tests (the gate) — memory mode
        run: python -m pytest

      - name: Tests — shared mode (Redis + Postgres + PostGIS, 3 real replicas)
        env:
          REDIS_URL: redis://localhost:6379/14
          DATABASE_URL: postgresql://careroute:careroute@localhost:5432/careroute
          GEO_TEST_DATABASE_URL: postgresql://careroute:careroute@localhost:5432/careroute
        run: python -m pytest -rs

      - name: Log in to Azure
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get the real registry login server
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        run: echo "ACR_LOGIN_SERVER=$(az acr show --name ${{ env.ACR_NAME }} --query loginServer -o tsv)" >> "$GITHUB_ENV"

      - name: Build the image in ACR, tagged with this commit
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --image ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Deploy the new image to Container Apps
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        run: |
          az extension add --name containerapp --upgrade
          az containerapp update \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --set-env-vars GIT_SHA=${{ github.sha }}

      - name: Smoke test the live app
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        run: |
          FQDN=$(az containerapp show -n ${{ env.CONTAINER_APP }} -g ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "Testing https://$FQDN ..."

          # 1) /version must report the commit we just deployed (not a stale image).
          #    The first hit may cold-start the container, so retry.
          OK=""
          for i in 1 2 3 4 5; do
            BODY=$(curl -fsS --max-time 20 "https://$FQDN/version" || true)
            echo "$BODY"
            if echo "$BODY" | grep -q '"commit":"${{ github.sha }}"'; then
              echo "version ok"; OK=1; break
            fi
            echo "waiting for the new revision to go live (attempt $i)..."; sleep 15
          done
          if [ -z "$OK" ]; then
            echo "Smoke test FAILED: /version never reported ${{ github.sha }}"; exit 1
          fi

          # 2) The emergency path must answer: rules only, no model, no login,
          #    so this is fast and deterministic even on a cold container.
          CARE_OK=""
          for i in 1 2 3; do
            RESP=$(curl -fsS --max-time 30 -X POST "https://$FQDN/chat" \
              -H "Content-Type: application/json" \
              -d '{"message":"crushing chest pain and sweating"}' || true)
            if echo "$RESP" | grep -q '"outcome":"emergency"'; then
              echo "$RESP"; CARE_OK=1; break
            fi
            echo "chat attempt $i returned no emergency answer yet, retrying..."; sleep 5
          done
          if [ -z "$CARE_OK" ]; then
            echo "Smoke test FAILED: /chat did not answer the emergency path"; exit 1
          fi
          echo "Smoke test passed."